<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160" fill="none">
  <defs>
    <filter id="inkGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#1E40AF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g id="signature-shailesh-pradhan" filter="url(#inkGlow)">
    <!-- Initial Flourish & Capital 'S' -->
    <path d="M 45,95 C 38,82 42,50 68,32 C 92,18 108,35 102,62 C 96,88 65,108 52,118 C 42,126 50,132 68,130 C 88,128 102,112 112,98" 
          stroke="#1E40AF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 'h' - tall ascending loop -->
    <path d="M 110,105 C 114,80 120,40 128,24 C 132,16 138,20 136,36 C 132,65 125,106 122,116 C 128,96 138,84 148,84 C 158,84 159,96 156,114" 
          stroke="#1E40AF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 'a' - oval body and downstroke -->
    <path d="M 172,94 C 164,86 154,92 152,102 C 150,112 158,118 168,116 C 176,114 180,104 180,92 C 180,102 182,112 186,115" 
          stroke="#1E40AF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 'i' - stem and dot -->
    <path d="M 188,96 C 192,94 196,106 198,115 C 200,117 204,116 208,112" 
          stroke="#1E40AF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="196" cy="80" r="3.2" fill="#1E40AF" />

    <!-- 'l' - elegant high loop -->
    <path d="M 206,114 C 212,90 220,38 228,26 C 234,18 238,24 235,42 C 230,72 224,105 222,116" 
          stroke="#1E40AF" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 'e' - quick cursive loop -->
    <path d="M 224,114 C 232,108 244,92 240,86 C 235,80 228,88 232,102 C 236,114 246,116 254,112" 
          stroke="#1E40AF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 's' - sharp crest -->
    <path d="M 254,112 C 260,100 268,90 274,90 C 278,90 276,98 270,105 C 264,112 272,116 280,112" 
          stroke="#1E40AF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 'h' - second tall loop connecting to Pradhan -->
    <path d="M 280,112 C 286,88 294,44 300,30 C 304,22 308,26 306,42 C 302,70 296,104 294,115 C 300,98 310,88 320,88 C 328,88 330,98 328,114" 
          stroke="#1E40AF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Capital 'P' in Pradhan - bold descending stroke & generous loop -->
    <path d="M 346,70 C 348,50 350,95 344,142 C 342,156 346,158 350,146 C 356,126 362,80 364,56 C 366,36 384,34 394,44 C 404,54 402,74 388,84 C 374,92 356,90 348,88" 
          stroke="#1E40AF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 'r' - shoulder arch -->
    <path d="M 388,102 C 394,92 404,90 410,94 C 412,98 410,108 412,114" 
          stroke="#1E40AF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 'a' - oval -->
    <path d="M 424,96 C 418,90 412,94 410,102 C 408,112 414,116 422,115 C 428,114 430,104 430,94 C 430,104 432,112 436,115" 
          stroke="#1E40AF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 'd' - ascending vertical ascender -->
    <path d="M 448,96 C 442,90 436,94 434,102 C 432,112 438,116 446,115 C 448,114 450,104 450,52 C 450,44 454,42 456,48 C 456,66 454,105 458,115" 
          stroke="#1E40AF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 'h' - loop -->
    <path d="M 460,112 C 464,96 468,68 472,56 C 474,50 478,52 476,64 C 474,84 470,106 470,114 C 474,100 480,94 486,94 C 490,94 492,100 490,112" 
          stroke="#1E40AF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 'a' - ending with 'n' wave -->
    <path d="M 490,112 C 496,104 502,102 506,106 C 508,110 506,115 510,114 C 514,112 520,104 524,104 C 528,104 528,112 532,114" 
          stroke="#1E40AF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Expressive Underline Swoosh & Flourish -->
    <path d="M 50,136 C 130,144 260,146 420,132 C 465,128 505,120 528,112" 
          stroke="#1E40AF" stroke-width="3.8" stroke-linecap="round" />

    <path d="M 425,142 C 465,138 495,132 515,124" 
          stroke="#1E40AF" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>
